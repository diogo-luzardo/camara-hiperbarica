# ===================================================================
# Configurações do Quarkus - Sistema Clínica Câmara Hiperbárica (OHB)
# ===================================================================

# Configuração HTTP e CORS para Tablet e Frontend Web
quarkus.http.port=8080
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with

# Configurações do Banco de Dados (H2 por padrão em dev/test, PostgreSQL para prod)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=${DB_USER:sa}
quarkus.datasource.password=${DB_PASSWORD:sa}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:h2:file:./data/clinica_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}

# H2 Console (Servidor Web H2 ativado automaticamente na porta 8082 em modo dev)
h2.console.port=8082

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.s3.aws.region=us-east-1
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test-key
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test-secret

# Configuração de Produção (%prod) - PostgreSQL
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_ohb}

# Hibernate ORM
# Em desenvolvimento recria as tabelas com os novos campos (deleted_at, updated_at, etc.)
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# AWS S3 (Armazenamento de Fotos de Lesões e Prontuários Escaneados)
quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.aws.credentials.type=default
clinica.s3.bucket-name=${S3_BUCKET_NAME:clinica-ohb-prontuarios}

# Documentação OpenAPI e Swagger UI (http://localhost:8080/q/swagger-ui)
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
